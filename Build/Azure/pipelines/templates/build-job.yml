parameters:
  with_nugets: false
  with_examples: false
  with_tests: false
  with_analyzer_tests: false
  with_singlefile_smoke: false
  with_analyzers: false
  with_api_analyzers: false
  with_release: false

jobs:
- job: build_job
  pool:
    vmImage: 'windows-2025'
  displayName: 'Build'
  timeoutInMinutes: 120 # 60 min sometimes is not enough to build all test TFMs for release build
  variables:
    with_analyzers: ${{ parameters.with_analyzers }}
    with_api_analyzers: ${{ parameters.with_api_analyzers }}

  steps:

# use latest SDK explicitly to avoid issues with slow azure updates
  - task: UseDotNet@2
    displayName: 'Use latest .NET SDK'
    inputs:
      packageType: sdk
      version: 9.x

  - task: UseDotNet@2
    displayName: 'Use latest .NET SDK'
    inputs:
      packageType: sdk
      version: 10.x

  # Tests.Analyzers targets net8.0 (to match the Net80 reference pack the Roslyn testing SDK compiles snippets
  # against); the windows-2025 image no longer ships an x64 .NET 8 runtime, so provision it or the net8.0 test
  # host fails to launch ("You must install or update .NET"). Runtime only — SDK 10 builds the net8.0 target.
  - task: UseDotNet@2
    displayName: 'Use .NET 8 runtime (Tests.Analyzers net8.0 host)'
    inputs:
      packageType: runtime
      version: 8.x
    # Only when the analyzer tests actually run — the provider matrix inherits with_analyzer_tests: false
    # and skips them, so it needn't provision the net8.0 runtime.
    condition: and(succeeded(), ${{ parameters.with_analyzer_tests }})

# tag version numbers appropriately
  - powershell: echo "##vso[task.setvariable variable=versionSuffix]-dev.$(Build.BuildId)"
    condition: ne(variables['Build.SourceBranchName'], variables['release_branch'])
    displayName: Set version suffix (non-release)

  - powershell: echo "##vso[task.setvariable variable=applyVersionSuffix]false"
    condition: eq(variables['Build.SourceBranchName'], variables['release_branch'])
    displayName: Remove version suffix (release)

  - task: DotNetCoreCLI@2
    inputs:
      command: build
      projects: 'Examples/Examples.slnx'
      arguments: '--configuration Debug'
    displayName: Build Examples (verify)
    condition: and(succeeded(), ${{ parameters.with_examples }})

  # Roslyn analyzer/code-fix unit tests for Source/LinqToDB.Analyzers*. DB-free and provider-independent, so they
  # run here on the build agent rather than in the provider test matrix. Fast (seconds); the MTP NUnit runner
  # is selected via global.json.
  - task: DotNetCoreCLI@2
    inputs:
      command: test
      projects: 'Tests/Tests.Analyzers/Tests.Analyzers.csproj'
      arguments: '--configuration $(test_configuration)'
    displayName: Run Analyzer Tests
    condition: and(succeeded(), ${{ parameters.with_analyzer_tests }})

  # PublishSingleFile smoke test — regression guard for linq2db/linq2db#5488.
  # Provider detectors must not rely on Assembly.Location / File.Exists heuristics
  # that silently misbehave in a single-file bundle. The Tests.SingleFile binary
  # references Microsoft.Data.Sqlite only, opens a connection, runs a query, and
  # exits 0 on success; any detection/load regression surfaces here.
  - task: CmdLine@2
    inputs:
      script: |
        ECHO ON
        dotnet publish Tests/Tests.SingleFile/Tests.SingleFile.csproj -c Release -f net10.0 -r win-x64 --self-contained true -p:PublishSingleFile=true -o .build/publish/singlefile
        if %errorlevel% neq 0 exit /b %errorlevel%
        .build\publish\singlefile\linq2db.Tests.SingleFile.exe
        if %errorlevel% neq 0 exit /b %errorlevel%
    displayName: PublishSingleFile Smoke Test
    condition: and(succeeded(), ${{ parameters.with_singlefile_smoke }})

# Only the graph Build Test Artifacts publishes, not the whole solution: LinqToDB.CLI has the slowest
# restore in the run at 1.4 min and finishes it last, and Tests.T4 is the last project to compile, so
# between them they add ~2.3 min to a step whose every minute is serial prefix. Nothing is left
# unchecked - the build pipeline compiles all of linq2db.slnx on the same PR, and Tests.LinqToDB.CLI
# has its own test-cli pipeline.
  - task: DotNetCoreCLI@2
    inputs:
      command: build
      projects: $(test_solution_filter)
      arguments: --configuration $(test_configuration)
    displayName: Build Solution for Tests
    condition: and(succeeded(), ${{ parameters.with_tests }})
    retryCountOnTaskFailure: 1 # https://github.com/dotnet/sdk/issues/44080

  - task: CmdLine@2
    inputs:
      script: |
        ECHO ON
        REM publish main and ef.core tests for all TFMs (without architecture!)
        FOR %%f IN ($(netfx_tfm) net8.0 net9.0 net10.0) DO (
            dotnet publish Tests/Linq/Tests.csproj -f %%f -c $(test_configuration) -o .build/publish/Tests/$(test_configuration)/%%f_x64
            if %errorlevel% neq 0 exit
            )

        REM -a x64: net462 is AnyCPU and runs as x64; without an explicit RID the SQLitePCLRaw net4x
        REM native target ships only the x86 e_sqlite3, which the x64 EF test process cannot load.
        dotnet publish Tests/EntityFrameworkCore/Tests.EntityFrameworkCore.EF3.csproj -f net462 -c $(test_configuration) -a x64 -o .build/publish/EFTests/$(test_configuration)/net462_x64
        if %errorlevel% neq 0 exit

        dotnet publish Tests/EntityFrameworkCore/Tests.EntityFrameworkCore.EF8.csproj -f net8.0 -c $(test_configuration) -o .build/publish/EFTests/$(test_configuration)/net8.0_x64
        if %errorlevel% neq 0 exit
        
        dotnet publish Tests/EntityFrameworkCore/Tests.EntityFrameworkCore.EF9.csproj -f net9.0 -c $(test_configuration) -o .build/publish/EFTests/$(test_configuration)/net9.0_x64
        if %errorlevel% neq 0 exit
        
        dotnet publish Tests/EntityFrameworkCore/Tests.EntityFrameworkCore.EF10.csproj -f net10.0 -c $(test_configuration) -o .build/publish/EFTests/$(test_configuration)/net10.0_x64
        if %errorlevel% neq 0 exit

        mkdir testing
        if %errorlevel% neq 0 exit

        REM prepare test artifacts with binaries and test configs
        FOR %%f IN ($(netfx_tfm) net8.0 net9.0 net10.0) DO (
            FOR %%a IN (x64) DO (
                xcopy /i /s .build\publish\Tests\$(test_configuration)\%%f_%%a testing\%%f\main\%%a
                if %errorlevel% neq 0 exit
                xcopy /i /s .build\publish\EFTests\$(test_configuration)\%%f_%%a testing\%%f\efcore\%%a
                if %errorlevel% neq 0 exit
                copy DataProviders.json testing\%%f\main\%%a
                if %errorlevel% neq 0 exit
                copy DataProviders.json testing\%%f\efcore\%%a
                if %errorlevel% neq 0 exit
                REM ship .runsettings next to each test app: MTP does not auto-discover it, NUnit honors it via --settings (AssemblySelectLimit)
                copy .runsettings testing\%%f\main\%%a
                if %errorlevel% neq 0 exit
                copy .runsettings testing\%%f\efcore\%%a
                if %errorlevel% neq 0 exit
            )
        )

        FOR %%c IN (netfx net80 net90 net100) DO (
            xcopy /i Build\$(test_configuration)\%%c testing\configs\%%c
            if %errorlevel% neq 0 exit
        )

        xcopy /i Build\$(test_configuration)\scripts testing\scripts
        if %errorlevel% neq 0 exit

        copy "Data\Create Scripts\Northwind.sql" testing\scripts\northwind.sql
        if %errorlevel% neq 0 exit
    condition: and(succeeded(), ${{ parameters.with_tests }})
    displayName: Build Test Artifacts

  - task: PublishPipelineArtifact@1
    inputs:
      path: '$(Build.SourcesDirectory)/testing/configs'
      artifact: $(artifact_test_configs)
    condition: and(succeeded(), ${{ parameters.with_tests }})
    displayName: Publish Test Configs

  - task: PublishPipelineArtifact@1
    inputs:
      path: '$(Build.SourcesDirectory)/testing/scripts'
      artifact: $(artifact_test_scripts)
    condition: and(succeeded(), ${{ parameters.with_tests }})
    displayName: Publish Test Scripts

  - task: PublishPipelineArtifact@1
    inputs:
      path: '$(Build.SourcesDirectory)/testing/net462'
      artifact: $(artifact_test_netfx_binaries)
    condition: and(succeeded(), ${{ parameters.with_tests }})
    displayName: Publish NETFX Test Binaries

  - task: PublishPipelineArtifact@1
    inputs:
      path: '$(Build.SourcesDirectory)/testing/net8.0'
      artifact: $(artifact_test_net80_binaries)
    condition: and(succeeded(), ${{ parameters.with_tests }})
    displayName: Publish NET 8.0 Test Binaries

  - task: PublishPipelineArtifact@1
    inputs:
      path: '$(Build.SourcesDirectory)/testing/net9.0'
      artifact: $(artifact_test_net90_binaries)
    condition: and(succeeded(), ${{ parameters.with_tests }})
    displayName: Publish NET 9.0 Test Binaries

  - task: PublishPipelineArtifact@1
    inputs:
      path: '$(Build.SourcesDirectory)/testing/net10.0'
      artifact: $(artifact_test_net100_binaries)
    condition: and(succeeded(), ${{ parameters.with_tests }})
    displayName: Publish NET 10.0 Test Binaries

# we shouldn't care about CI cleanup in general, but it's about limited disk space we need for next tasks
  - task: CmdLine@2
    inputs:
      script: |
        ECHO ON
        RD $(Build.SourcesDirectory)\testing /S /Q
        RD $(Build.SourcesDirectory)\.build /S /Q
    condition: and(succeeded(), ${{ parameters.with_tests }})
    displayName: Cleanup Test Artifacts

  - task: DotNetCoreCLI@2
    inputs:
      command: build
      projects: $(solution)
      arguments: -property:RunAnalyzersDuringBuild=${{ variables['with_analyzers'] }} -property:RunApiAnalyzersDuringBuild=${{ variables['with_api_analyzers'] }} --configuration $(release_configuration)
    displayName: Build Solution for Nuget
    condition: and(succeeded(), ${{ parameters.with_nugets }})

  - task: DotNetCoreCLI@2
    inputs:
      command: custom
      custom: pack
      projects: $(solution)
      arguments: -property:RunAnalyzersDuringBuild=${{ variables['with_analyzers'] }} -property:RunApiAnalyzersDuringBuild=${{ variables['with_api_analyzers'] }} --configuration $(release_configuration)
    displayName: Pack Solution for Nuget
    condition: and(succeeded(), ${{ parameters.with_nugets }})

  - task: PublishPipelineArtifact@1
    inputs:
      path: '$(Build.SourcesDirectory)/.build/package/release'
      artifact: '$(artifact_nugets)'
    displayName: Publish linq2db nugets
    condition: and(succeeded(), ${{ parameters.with_nugets }})

  - task: PublishBuildArtifacts@1
    inputs:
      pathToPublish: '$(Build.SourcesDirectory)/.build/lpx'
      artifactName: '$(artifact_linq2db_linqpad_lpx)'
    displayName: Publish LPX to artifacts
    condition: and(succeeded(), ${{ parameters.with_nugets }})

  - task: PowerShell@2
    inputs:
      targetType: 'inline'
      script: |
        $version = dotnet msbuild Source\LinqToDB\LinqToDB.csproj -getProperty:Version
        $relnotesVersion = $version -replace '\.',''
        Write-Host "Create release v$version draft"
        $output = gh release create v$version "$(Build.SourcesDirectory)/.build/lpx/linq2db.LINQPad.lpx" --draft --fail-on-no-commits --generate-notes --latest --notes "[Release notes](https://github.com/linq2db/linq2db/wiki/Releases-and-Roadmap#release-$relnotesVersion) [Nugets](https://www.nuget.org/profiles/LinqToDB)" --title "Release $version"
        if ($LASTEXITCODE -ne 0) {
            Write-Host "Command failed. Error code ${LASTEXITCODE}, output: ${output}"
            exit 1
        }
      workingDirectory: '$(System.DefaultWorkingDirectory)'
    displayName: Create Release Draft
    condition: and(succeeded(), ${{ parameters.with_release }})
    env:
      GITHUB_TOKEN: $(RELEASES_GH_PAT)

################################################################################################
#  WIN-X86 TEST ARTIFACTS                                                                      #
#                                                                                              #
#  -a x86 rebuilds the whole graph for the win-x86 RID, so these eight publishes take ~6.8 min #
#  against ~2.1 for their x64 counterparts, which reuse "Build Solution for Tests". Doing them #
#  here lifts that off the critical path: the job starts alongside build_job and finishes long #
#  before it, in a window where 9 of the 10 parallel slots sit idle anyway.                    #
#                                                                                              #
#  Only the three Access legs run x86 (x86: true in test-matrix.yml), but the binaries used to #
#  ride along inside every per-TFM artifact - so every linux leg downloaded win-x86 binaries   #
#  it cannot execute. Publishing them separately is what stops that.                           #
################################################################################################
- job: build_x86_job
  pool:
    vmImage: 'windows-2025'
  displayName: 'Build (win-x86 test artifacts)'
  timeoutInMinutes: 60
  condition: and(succeeded(), ${{ parameters.with_tests }})

  steps:

  - task: UseDotNet@2
    displayName: 'Use latest .NET SDK'
    inputs:
      packageType: sdk
      version: 9.x

  - task: UseDotNet@2
    displayName: 'Use latest .NET SDK'
    inputs:
      packageType: sdk
      version: 10.x

# stamped the same way as build_job, so both halves of a leg's binaries carry one version
  - powershell: echo "##vso[task.setvariable variable=versionSuffix]-dev.$(Build.BuildId)"
    condition: ne(variables['Build.SourceBranchName'], variables['release_branch'])
    displayName: Set version suffix (non-release)

  - powershell: echo "##vso[task.setvariable variable=applyVersionSuffix]false"
    condition: eq(variables['Build.SourceBranchName'], variables['release_branch'])
    displayName: Remove version suffix (release)

  - task: CmdLine@2
    inputs:
      script: |
        ECHO ON
        REM publish main and ef.core tests for all TFMs for win-x86
        dotnet publish Tests/Linq/Tests.csproj -f net462 -c $(test_configuration) -a x86 -o .build/publish/Tests/$(test_configuration)/net462_x86
        if %errorlevel% neq 0 exit

        FOR %%f IN (net8.0 net9.0 net10.0) DO (
            dotnet publish Tests/Linq/Tests.csproj -f %%f -c $(test_configuration) -a x86 /p:X86STUBS=True -o .build/publish/Tests/$(test_configuration)/%%f_x86
            if %errorlevel% neq 0 exit
        )

        dotnet publish Tests/EntityFrameworkCore/Tests.EntityFrameworkCore.EF3.csproj -f net462 -c $(test_configuration) -a x86 -o .build/publish/EFTests/$(test_configuration)/net462_x86
        if %errorlevel% neq 0 exit

        dotnet publish Tests/EntityFrameworkCore/Tests.EntityFrameworkCore.EF8.csproj -f net8.0 -c $(test_configuration) -a x86 -o .build/publish/EFTests/$(test_configuration)/net8.0_x86
        if %errorlevel% neq 0 exit

        dotnet publish Tests/EntityFrameworkCore/Tests.EntityFrameworkCore.EF9.csproj -f net9.0 -c $(test_configuration) -a x86 -o .build/publish/EFTests/$(test_configuration)/net9.0_x86
        if %errorlevel% neq 0 exit

        dotnet publish Tests/EntityFrameworkCore/Tests.EntityFrameworkCore.EF10.csproj -f net10.0 -c $(test_configuration) -a x86 -o .build/publish/EFTests/$(test_configuration)/net10.0_x86
        if %errorlevel% neq 0 exit

        mkdir testing_x86
        if %errorlevel% neq 0 exit

        REM same layout as the x64 artifacts, so a leg finds main/x86 and efcore/x86 where it expects
        FOR %%f IN ($(netfx_tfm) net8.0 net9.0 net10.0) DO (
            xcopy /i /s .build\publish\Tests\$(test_configuration)\%%f_x86 testing_x86\%%f\main\x86
            if %errorlevel% neq 0 exit
            xcopy /i /s .build\publish\EFTests\$(test_configuration)\%%f_x86 testing_x86\%%f\efcore\x86
            if %errorlevel% neq 0 exit
            copy DataProviders.json testing_x86\%%f\main\x86
            if %errorlevel% neq 0 exit
            copy DataProviders.json testing_x86\%%f\efcore\x86
            if %errorlevel% neq 0 exit
            REM ship .runsettings next to each test app: MTP does not auto-discover it, NUnit honors it via --settings (AssemblySelectLimit)
            copy .runsettings testing_x86\%%f\main\x86
            if %errorlevel% neq 0 exit
            copy .runsettings testing_x86\%%f\efcore\x86
            if %errorlevel% neq 0 exit
        )
    displayName: Build Test Artifacts (win-x86)

  - task: PublishPipelineArtifact@1
    inputs:
      path: '$(Build.SourcesDirectory)/testing_x86'
      artifact: $(artifact_test_x86_binaries)
    displayName: Publish win-x86 Test Binaries

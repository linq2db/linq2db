jobs:
- job: build_nugets_job
  pool:
    vmImage: 'windows-2025'
  displayName: 'Nugets Generation'
  dependsOn: build_job
  condition: succeeded()

  steps:

  - task: DownloadPipelineArtifact@2
    displayName: Download LinqToDB files
    inputs:
      artifactName: '$(artifact_nugets)'
      targetPath: '$(Build.SourcesDirectory)/.build/nugets'

  - task: PowerShell@2
    displayName: Verify nupkg sizes (fail-fast before publish)
    inputs:
      pwsh: true
      filePath: '$(Build.SourcesDirectory)/Build/Azure/scripts/verify-nuget-sizes.ps1'
      arguments: '-PackagesDir "$(Build.SourcesDirectory)/.build/nugets" -WarnMB 180 -FailMB 200'

  # The analyzers are packed into the linq2db package by a target hooking the SDK-private _GetPackageFiles: if that
  # hook stops firing, or its PackagePath is wrong, pack still succeeds with an analyzer-free package, and no test
  # consumes the produced package — so a silent drop is only visible here.
  - task: PowerShell@2
    displayName: Verify bundled analyzers in linq2db nupkg (fail-fast before publish)
    inputs:
      pwsh: true
      filePath: '$(Build.SourcesDirectory)/Build/Azure/scripts/verify-analyzer-packaging.ps1'
      arguments: '-PackagesDir "$(Build.SourcesDirectory)/.build/nugets"'

  - task: NuGetCommand@2
    inputs:
      command: 'push'
      packagesToPush: '$(Build.SourcesDirectory)/.build/nugets/*.nupkg'
      nuGetFeedType: 'internal'
      publishVstsFeed: '0dcc414b-ea54-451e-a54f-d63f05367c4b/967a4107-9788-41a4-9f6d-a2318aab1410'
    displayName: Publish to Azure Artifacts feed
    condition: and(succeeded(), eq(variables['Build.SourceBranchName'], variables['master_branch']))

  - task: NuGetCommand@2
    inputs:
      command: 'push'
      packagesToPush: '$(Build.SourcesDirectory)/.build/nugets/*.nupkg'
      nuGetFeedType: 'external'
      publishFeedCredentials: 'linq2db nuget.org feed'
    displayName: Publish to Nuget.org
    condition: and(succeeded(), eq(variables['Build.SourceBranchName'], variables['release_branch']))

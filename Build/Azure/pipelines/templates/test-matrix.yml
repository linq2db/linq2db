parameters:
  enabled: false
  with_baselines: false
  full_run: false # when false, only netfx and latest netX tests executed (linq2db only, efcore tests executed for all TFMs always)
  linux_max_parallel: 0 # linux legs allowed to run at once, 0 for uncapped. See test-jobs.yml.
  db_filter: '[all]'

# db_filter specify test db selection filter for pipeline. Current list of supported values:
# - '[all]' - any target supported
# - '[access.all]' - Access targets supported
# - '[db2.all]' - DB2 targets supported
# - '[firebird.all]' - Firebird targets supported
# - '[informix.all]' - Informix targets supported
# - '[mysql.all]' - MySql/MariaDB targets supported
# - '[oracle.all]' - Oracle targets supported
# - '[postgresql.all]' - PostgreSQL targets supported
# - '[saphana.all]' - SAP HANA targets supported
# - '[sqlce.all]' - SqlCE targets supported
# - '[sqlite.all]' - SQLite targets supported
# - '[sqlserver.all]' - SQL Server targets supported
# - '[sqlserver.2019]' - SQL Server 2017 + 2019 targets supported (one job covers both versions)
# - '[sqlserver.2022]' - SQL Server 2022 + 2025 targets supported (one job covers both versions)
# - '[sybase.ase.all]' - SAP/Sybase ASE targets supported
# - '[duckdb.all]' - DuckDB targets supported
# - '[clickhouse.all]' - Yandex ClickHouse targets supported
# - '[ydb.all]' - YDB targets supported
# Note that filter value enclosed in [] brackets. That predates the `filters` list below, when selection
# was a substring test and the brackets kept '[sqlserver.2019]' from matching inside another tag; the
# comparison is exact now, but the brackets stay because the same strings are the /azp db_filter values.

# Test matrix (list of all database test runs with configuration options)
# Because azure pipelines doesn't support non-string variables and strategy templates
# (see https://developercommunity.visualstudio.com/content/problem/812728/variables-in-yaml-pipeline-are-not-allowing-to-def.html)
# we use parameter to define test matrix..
# each test_matrix list entry could define following properties:

# GENERAL PROPERTIES
# - name    (string, required)            : name of test matrix entry (unique, no spaces/dots)
# - title   (string, required)            : test run name, added to display name for testrun
# - x86     (true/false string, optional) : windows-only, install dotnet sdk x86
# - filters (list of strings, required)   : db_filter values that select this entry. The entry runs when
#   parameters.db_filter is one of them, tested with containsValue in test-jobs.yml. This is plain data
#   rather than the paired ${{ if }} / ${{ if not }} blocks it replaced, so the same file is readable by
#   Azure natively and by an ordinary YAML parser on the GitHub side - one matrix, no generator, nothing
#   to keep in sync. Every entry carries '[all]' plus its own tags.
# - retry   (true/false string, optional) : specify that test run should retry on failue, use only for unstable runs like access and oracle

# OPERATION SYSTEM SELECTORS
# - enable_os_windows  (true/false string) : enables testrun for windows 2025 image (windows-2025)
# - enable_os_ubuntu   (true/false string) : enables testrun for Ubuntu 24.04 image (ubuntu-24.04)

# TARGET FRAMEWORK SELECTORS
# - enable_fw_netfx    (true/false string) : enables testrun against .net framework 4.6.2
# - enable_fw_net80    (true/false string) : enables testrun against .net 8.0
# - enable_fw_net90    (true/false string) : enables testrun against .net 9.0
# - enable_fw_net100   (true/false string) : enables testrun against .net 10.0

# TEST CONFIG SELECTOR
# - config_win   (string) : contains name of test config json file for windows runs (without extension)
# - config_linux (string) : contains name of test config json file for linux runs (without extension)

# SETUP SCRIPT SELECTOR
# GLOBAL (run once per test instance). E.g. used to setup database once
# - script_win_global   (string) : contains name of global cmd setup script for windows runs (with extension)
# - psscript_win_global (string) : contains name of global powershell setup script for windows runs (with extension)
# - script_linux_global (string) : contains name of global shell setup script for linux runs (with extension)
# LOCAL (run once per test framework). E.g. used to setup test files for specific framework run
# - script_win_local   (string) : contains name of local cmd setup script for windows runs (with extension)
# - psscript_win_local (string) : contains name of local powershell setup script for windows runs (with extension)
# - script_linux_local (string) : contains name of local shell setup script for linux runs (with extension)
# - pre_test_win_local (string) : contains name of local cmd setup script for windows runs (with extension) executed before test run
# - post_test_win_local (string): contains name of local cmd setup script for windows runs (with extension) executed after test run

# MISC
# - win_tfms_always (true/false string, optional) : windows-only. By default the windows job enables
#   net8/9/10 only for an entry with no linux job, because for an entry that has one the linux leg
#   already ran those TFMs (see test-jobs.yml). Set this when the windows leg tests something the
#   linux leg cannot reach on the same TFM - a windows-native provider binary, for instance.
# - win_efcore_only (true/false string, optional) : windows-only, run just the EF.Core suite on non-release
#   runs and leave the main suite to the linux legs. Since netfx runs only on windows, that also makes the
#   entry's netfx main suite release-run only. Release runs (full_run) run the main suite for every TFM.

jobs:
  - template: test-jobs.yml
    parameters:
      enabled: ${{ parameters.enabled }}
      with_baselines: ${{ parameters.with_baselines }}
      full_run: ${{ parameters.full_run }}
      linux_max_parallel: ${{ parameters.linux_max_parallel }}
      test_matrix:
# Two things decide the order legs run in, and which one you see depends on whether the job caps its
# parallelism. Both were measured on build 23050, the first run to carry a cap.
#
#   - maxParallel decides WHICH legs are released next, and takes them in the order they are declared
#     here. The linux job caps at linux_max_parallel, and the six legs it started were s p i c l n -
#     exactly the first six ubuntu-enabled entries in the file as it then stood - followed by m, t and
#     j as slots freed, again in file order. The alphabet would have given b c h i j k.
#   - Legs already released take agents in case-insensitive alphabetical order of the key. The windows
#     job has no cap, so all thirteen are released at once and only this rule is visible: the first
#     five and the last three matched the alphabet exactly, the middle four were out by a place or
#     two, which is acquisition jitter between legs freeing slots seconds apart. File order would have
#     started s r v x.
#
# So keep this file sorted by key. Then both rules give the same order, and one edit maintains both.
# The cap is off by default now, which leaves the first rule dormant and the sort with it, but sorted
# is what this file should be either way - a cap can then be switched on without reopening the trap.
# Grouping entries by provider family used to be free, because without a cap the file order was inert -
# builds 22995 and 23009 had different declaration orders and both matched the alphabet 13/13 on their
# windows legs. The cap made file order load-bearing again, and the family grouping had put ClickHouse,
# the second-longest linux leg, last: on 23050 it started 90 minutes in and defined the tail by itself.
# Replaying 23028's leg durations through the slot model puts that at 153.9 min against 122.3 sorted.
#
# The a_ .. y_ prefixes come from measured durations, longest first, so the long legs are the ones
# dispatched early - a leg that starts late only gets a slot once the other ten are taken, and then
# runs alone in the tail. Measured, not modelled: 23024 and 23028 differ only in these prefixes, and
# the test phase went from 157.0 to 140.6 min with the leg work unchanged at 1153 and 1148 agent-
# minutes, so the whole gain is packing - average parallelism 7.34 to 8.17. Durations drift, so
# reletter when a leg has clearly outgrown its neighbours, and move its block to keep the file sorted.
#
# Two things this cannot do, both measured rather than assumed:
#   - Hide itself. The key is appended to the job name and a variable is not expanded in a job
#     displayName, so "Win a_SqlServer2014" is the best available; probe build 23041 rendered a
#     templated name as the literal "Win $(title) a_SqlServer2014".
#   - Order the windows block against the linux one. Those are separate jobs, and which goes first
#     varies with the names held constant - five runs to two, plus a third order in the probe.
#
# An earlier attempt numbered the keys 01_ .. 25_ and did nothing. Those names break the documented
# rule that a matrix configuration name must start with a letter, and the build that tested them
# also shared the agent pool with another test-all run, so it proved neither way. Hence letters.
#
# Sorting scatters the provider families, so: Access is r_Access_MDB, v_Access_ACE_Odbc,
# x_Access_ACE_OleDb and y_Access_ACE_x64. SQL Server is a_SqlServer2014, d_SqlServer2012,
# e_SqlServer2008, f_SqlServer2016, l_SqlServer2017_2019, m_SqlServer2022_2025, n_SqlServer2019Extras
# and o_SqlServer2005. Oracle is j_Oracle1819, q_Oracle2123 and t_Oracle1112. PostgreSQL is
# c_PostgreSQL2 and i_PostgreSQL1. The rest are one entry each: b_ClickHouse, g_SqlCE, h_SAPHANA2,
# k_Firebird, p_MySQL, s_SQLite, u_YdbSybase, w_DB2InformixDuckDB.
# 2008-2016 run one version per job. The original reason was that batching two versions in a single
# netfx process exhausted memory (unbounded per-MappingSchema attribute cache). That no longer
# reproduces: the merged 2017+2019 and 2022+2025 jobs put four providers through one netfx process and
# their NETFX main suites have completed on full_run builds 22779, 22810, 22850 and 22863. So the split
# is kept here conservatively, not as a measured limit - it simply has not been retested for these
# versions.
        - name: a_SqlServer2014
          title: SQL Server 2014
          config_win: sqlserver.2014
          script_win_global: sqlserver.2014.cmd
          enable_os_windows: true
          enable_os_ubuntu: false
          enable_fw_netfx: true
          enable_fw_net80: true
          enable_fw_net90: true
          enable_fw_net100: true
          filters: [ '[all]', '[sqlserver.all]' ]

# All three ClickHouse providers (Driver/MySql/Octonica) target one server on separate
# databases (testdb1/2/3), so they run as concurrent lanes in a single job without contention.
        - name: b_ClickHouse
          title: ClickHouse (all providers)
          config_linux: clickhouse
          script_linux_global: clickhouse.sh
          enable_os_windows: false
          enable_os_ubuntu: true
          enable_fw_netfx: false
          enable_fw_net80: true
          enable_fw_net90: true
          enable_fw_net100: true
          filters: [ '[all]', '[clickhouse.all]' ]

        - name: c_PostgreSQL2
          title: PostgreSQL (13-19)
          config_linux: pgsql2
          script_linux_global: pgsql2.sh
          enable_os_windows: false
          enable_os_ubuntu: true
          enable_fw_netfx: false
          enable_fw_net80: true
          enable_fw_net90: true
          enable_fw_net100: true
          filters: [ '[all]', '[postgresql.all]' ]

        - name: d_SqlServer2012
          title: SQL Server 2012
          config_win: sqlserver.2012
          script_win_global: sqlserver.2012.cmd
          enable_os_windows: true
          enable_os_ubuntu: false
          enable_fw_netfx: true
          enable_fw_net80: true
          enable_fw_net90: true
          enable_fw_net100: true
          filters: [ '[all]', '[sqlserver.all]' ]

        - name: e_SqlServer2008
          title: SQL Server 2008
          config_win: sqlserver.2008
          script_win_global: sqlserver.2008.cmd
          enable_os_windows: true
          enable_os_ubuntu: false
          enable_fw_netfx: true
          enable_fw_net80: true
          enable_fw_net90: true
          enable_fw_net100: true
          filters: [ '[all]', '[sqlserver.all]' ]

        - name: f_SqlServer2016
          title: SQL Server 2016
          config_win: sqlserver.2016
          script_win_global: sqlserver.2016.cmd
          enable_os_windows: true
          enable_os_ubuntu: false
          enable_fw_netfx: true
          enable_fw_net80: true
          enable_fw_net90: true
          enable_fw_net100: true
          filters: [ '[all]', '[sqlserver.all]' ]

        - name: g_SqlCE
          title: SQL CE
          config_win: sqlce
          psscript_win_global: sqlce.ps1
          enable_os_windows: true
          enable_os_ubuntu: false
          enable_fw_netfx: true
          enable_fw_net80: true
          enable_fw_net90: true
          enable_fw_net100: true
          filters: [ '[all]', '[sqlce.all]' ]

        - name: h_SAPHANA2
          title: SAP HANA 2
          config_linux: hana2
          script_linux_global: hana2.sh
          script_linux_local: hana2.tests.sh
          enable_os_windows: false
          enable_os_ubuntu: true
          enable_fw_netfx: false
          enable_fw_net80: true
          enable_fw_net90: true
          enable_fw_net100: true
          filters: [ '[all]', '[saphana.all]' ]

        - name: i_PostgreSQL1
          title: PostgreSQL (9.2-12)
          config_linux: pgsql1
          script_linux_global: pgsql1.sh
          enable_os_windows: false
          enable_os_ubuntu: true
          enable_fw_netfx: false
          enable_fw_net80: true
          enable_fw_net90: true
          enable_fw_net100: true
          filters: [ '[all]', '[postgresql.all]' ]

        - name: j_Oracle1819
          title: Oracle 18c + 19c
          config_linux: oracle1819
          script_linux_global: oracle1819.sh
          enable_os_windows: false
          enable_os_ubuntu: true
          enable_fw_netfx: false
          enable_fw_net80: true
          enable_fw_net90: true
          enable_fw_net100: true
          retry: true # provider has issue with resource management
          filters: [ '[all]', '[oracle.all]' ]

        - name: k_Firebird
          title: Firebird (all versions)
          config_linux: firebird
          script_linux_global: firebird.sh
          enable_os_windows: false
          enable_os_ubuntu: true
          enable_fw_netfx: false
          enable_fw_net80: true
          enable_fw_net90: true
          enable_fw_net100: true
          filters: [ '[all]', '[firebird.all]' ]

        - name: l_SqlServer2017_2019
          title: SQL Server 2017 + 2019
          config_win: sqlserver.2017_2019
          config_linux: sqlserver.fts.2017_2019
          script_win_global: sqlserver.2017_2019.cmd
          script_linux_global: sqlserver.2017_2019.sh
          enable_os_windows: true
          enable_os_ubuntu: true
          enable_fw_netfx: true
          enable_fw_net80: true
          enable_fw_net90: true
          enable_fw_net100: true
          # 2017+: on Windows run only EF.Core for non-release runs (EF.Core needs netfx). The main
          # library then runs on Linux alone, i.e. net8/9/10 - this config's netfx main suite is
          # release-run only, deliberately. Release runs (full_run) run it on Windows for every TFM.
          win_efcore_only: true
          filters: [ '[all]', '[sqlserver.all]', '[sqlserver.2019]' ]

        - name: m_SqlServer2022_2025
          title: SQL Server 2022 + 2025
          config_win: sqlserver.2022_2025
          config_linux: sqlserver.2022_2025
          script_win_global: sqlserver.2022_2025.cmd
          script_linux_global: sqlserver.2022_2025.sh
          enable_os_windows: true
          enable_os_ubuntu: true
          enable_fw_netfx: true
          enable_fw_net80: true
          enable_fw_net90: true
          enable_fw_net100: true
          win_efcore_only: true
          filters: [ '[all]', '[sqlserver.all]', '[sqlserver.2022]' ]

# additional test runner as SqlServer2019 already takes a lot of time
        - name: n_SqlServer2019Extras
          title: SQL Server EXTRAS
          config_win: sqlserver.extras
          config_linux: sqlserver.extras
          script_win_global: sqlserver.extras.cmd
          script_linux_global: sqlserver.extras.sh
          enable_os_windows: true
          enable_os_ubuntu: true
          enable_fw_netfx: true
          enable_fw_net80: true
          enable_fw_net90: true
          enable_fw_net100: true
          # extras counts as 2017+ for the EF.Core-only-on-Windows-for-non-release rule
          win_efcore_only: true
          filters: [ '[all]', '[sqlserver.all]', '[sqlserver.2019]' ]

        - name: o_SqlServer2005
          title: SQL Server 2005
          config_win: sqlserver.2005
          script_win_global: sqlserver.2005.cmd
          pre_test_win_local: enable_tls11.cmd
          post_test_win_local: disable_tls11.cmd
          enable_os_windows: true
          enable_os_ubuntu: false
          enable_fw_netfx: true
          enable_fw_net80: true
          enable_fw_net90: true
          enable_fw_net100: true
          filters: [ '[all]', '[sqlserver.all]' ]

        - name: p_MySQL
          title: MySQL/MariaDB (all providers)
          config_linux: mysql
          script_linux_global: mysql.sh
          enable_os_windows: false
          enable_os_ubuntu: true
          enable_fw_netfx: false
          enable_fw_net80: true
          enable_fw_net90: true
          enable_fw_net100: true
          filters: [ '[all]', '[mysql.all]' ]

        - name: q_Oracle2123
          title: Oracle 21c + 23c
          config_linux: oracle2123
          script_linux_global: oracle2123.sh
          enable_os_windows: false
          enable_os_ubuntu: true
          enable_fw_netfx: false
          enable_fw_net80: true
          enable_fw_net90: true
          enable_fw_net100: true
          retry: true # provider has issue with resource management
          filters: [ '[all]', '[oracle.all]' ]

        - name: r_Access_MDB
          title: Access MDB (Jet/ODBC)
          config_win: access.mdb
          enable_os_windows: true
          enable_os_ubuntu: false
          enable_fw_netfx: true
          enable_fw_net80: true
          enable_fw_net90: true
          enable_fw_net100: true
          x86: true
          filters: [ '[all]', '[access.all]' ]

        - name: s_SQLite
          title: SQLite (all providers)
          config_win: sqlite
          config_linux: sqlite
          enable_os_windows: true
          enable_os_ubuntu: true
          enable_fw_netfx: true
          enable_fw_net80: true
          enable_fw_net90: true
          enable_fw_net100: true
          # On Windows, run only the EF.Core tests (which need netfx / EF Core 3.1) for non-release runs.
          # The main-library tests then run on Linux alone, which means net8/9/10: netfx runs nowhere but
          # Windows, so this config's netfx main suite is release-run only. That is a deliberate CI-time
          # trade-off, not an oversight - netfx main coverage on PR runs comes from Access, SqlCE and SQL
          # Server 2005-2016. Note this config also carries TestNoopProvider, so the provider-agnostic
          # tests are in the same position. Release runs (full_run) run the main suite on Windows for
          # every TFM.
          win_efcore_only: true
          filters: [ '[all]', '[sqlite.all]' ]

        - name: t_Oracle1112
          title: Oracle 11g + 12c
          config_linux: oracle1112
          script_linux_global: oracle1112.sh
          enable_os_windows: false
          enable_os_ubuntu: true
          enable_fw_netfx: false
          enable_fw_net80: true
          enable_fw_net90: true
          enable_fw_net100: true
          retry: true # provider has issue with resource management
          filters: [ '[all]', '[oracle.all]' ]

# DB2 + Informix + DuckDB and YDB + Sybase - fast providers paired per-job (distinct ports, no
# conflict) to save CI agent capacity without running several DB engines on one agent. DB2 keeps its
# native-driver local scripts (Informix.DB2 uses the DB2 client too). DuckDB is embedded - no
# container, no setup script - so it rides along at near-zero agent cost. On Windows the leg runs
# DuckDB alone (DB2/Informix have no Windows containers) via config_win, and stays full-run-only:
# DuckDB has no netfx-only tests, so PR runs are already covered by the Linux leg.
        - name: u_YdbSybase
          title: YDB + Sybase
          config_linux: ydbsybase
          script_linux_global: ydbsybase.sh
          enable_os_windows: false
          enable_os_ubuntu: true
          enable_fw_netfx: false
          enable_fw_net80: true
          enable_fw_net90: true
          enable_fw_net100: true
          filters: [ '[all]', '[sybase.ase.all]', '[ydb.all]' ]

# The two ACE providers run as separate entries, one provider each. Together they put ~14.9k tests through a
# single x86 process, which reaches ~1.7GB of reserved address space by the end - and NUnit's last act is to
# serialize the whole result document into one contiguous string, which then fails with OutOfMemoryException.
# That failure is deterministic, so unlike the random AV below it survives every retry and the leg stays red.
# Halving the run removes it: measured locally against the CI ACE build (2010 redist, x86), 7731 and 7715
# tests, both exit 0, no OOM. It costs no wall-clock either - the halves take 360s + 332s against 741s for the
# combined run - but only because TestsInitialization now holds one connection open per transport: splitting
# also takes away the ODBC anchor that used to keep the shared ACE engine warm for both, and without an OLE DB
# anchor of its own that half alone takes 1866s.
        - name: v_Access_ACE_Odbc
          title: Access ACE (ODBC) x86
          config_win: access.ace.odbc
          psscript_win_global: access.ace.ps1
          enable_os_windows: true
          enable_os_ubuntu: false
          enable_fw_netfx: true
          enable_fw_net80: true
          enable_fw_net90: true
          enable_fw_net100: true
          x86: true
          retry: true # x86 provider also could crash with AV as x64, but less often, so we can just restart it
          filters: [ '[all]', '[access.all]' ]

        - name: w_DB2InformixDuckDB
          title: DB2 + Informix + DuckDB
          config_win: duckdb
          config_linux: db2informixduckdb
          script_linux_global: db2informixduckdb.sh
          script_linux_local: db2.provider.sh
          ${{ if eq(parameters.full_run, true) }}:
            enable_os_windows: true
          ${{ if not(eq(parameters.full_run, true)) }}:
            enable_os_windows: false
          enable_os_ubuntu: true
          enable_fw_netfx: false
          enable_fw_net80: true
          enable_fw_net90: true
          enable_fw_net100: true
          # The windows leg runs DuckDB alone, against the windows-native DuckDB binary, which the
          # linux leg cannot exercise on any TFM - so it keeps net8/9/10 rather than following the
          # default "linux leg covers net8+" rule. DuckDB has no netfx tests, so without this the
          # leg would have no TFM enabled at all and fail on a missing .trx.
          win_tfms_always: true
          filters: [ '[all]', '[db2.all]', '[informix.all]', '[duckdb.all]' ]

        - name: x_Access_ACE_OleDb
          title: Access ACE (OLEDB) x86
          config_win: access.ace.oledb
          psscript_win_global: access.ace.ps1
          enable_os_windows: true
          enable_os_ubuntu: false
          enable_fw_netfx: true
          enable_fw_net80: true
          enable_fw_net90: true
          enable_fw_net100: true
          x86: true
          retry: true # x86 provider also could crash with AV as x64, but less often, so we can just restart it
          filters: [ '[all]', '[access.all]' ]

        - name: y_Access_ACE_x64
          title: Access ACE (ODBC-only) x64 # x64 OLEDB crashes randomly https://github.com/dotnet/runtime/issues/46187
          config_win: access.ace.x64
          psscript_win_global: access.ace.x64.ps1
          enable_os_windows: false # true # disabled due to https://github.com/dotnet/runtime/issues/46187
          enable_os_ubuntu: false
          enable_fw_netfx: true
          enable_fw_net80: true
          enable_fw_net90: true
          enable_fw_net100: true
          retry: true # x64 provider could crash with AV
          filters: [ '[all]', '[access.all]' ]

# DuckDB runs as part of the DB2 + Informix + DuckDB job above.

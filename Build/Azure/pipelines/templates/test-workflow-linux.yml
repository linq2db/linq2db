parameters:
  with_baselines: false
  full_run: false
  # Per-TFM knobs driving the loop below - see test-workflow-windows.yml for the field reference.
  # Linux has no netfx leg and is x64-only, so the entries carry no arch or netfx handling.
  tfms:
  - { flag: net80,  label: '.NET 8',  dir: 'net8.0',  sdk: '8.x',  pr_main: false }
  - { flag: net90,  label: '.NET 9',  dir: 'net9.0',  sdk: '9.x',  pr_main: false }
  - { flag: net100, label: '.NET 10', dir: 'net10.0', sdk: '10.x', pr_main: true  }

steps:
- checkout: none

# .NET 8 SDK already installed https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2204-Readme.md
# but we still need to install all required versions because only last installed available due to bug

# https://github.com/apache/flink/blob/master/tools/azure-pipelines/free_disk_space.sh
# when more space needed, uncomment more lines
- task: CmdLine@2
  inputs:
    script: |
      # Free disk space so large-DB jobs (Oracle 21/23) fit. Each step logs the space it
      # actually freed (avail before -> after); the ~sizes below are measured on build 22224.
      #
      # Enabled (each frees >= 1 GB): ~23.6 GB total, takes avail from ~15 GB to ~39 GB.
      # Disabled (freed < 1 GB, or unsafe) - uncomment if a job needs more headroom:
      #   apt clean      ~0.1 GB
      #   remove dotnet  ~2-3 GB  (breaks all legs - system dotnet is used before UseDotNet@2)
      avail() { df --output=avail -m / | tail -1 | tr -d ' '; }
      report() { local a=$(avail); echo ">>> $2: freed $(( a - $1 )) MB (avail now $a MB)"; }

      b=$(avail); sudo apt-get remove -y '^llvm-.*';        report $b "remove llvm (~1.4Gb)"
      b=$(avail); sudo rm -rf /usr/local/lib/android;       report $b "remove android (~10Gb)"
      b=$(avail); sudo rm -rf /usr/local/.ghcup/;           report $b "remove ghcup (~3.7Gb)"
      b=$(avail); sudo rm -rf /opt/hostedtoolcache/CodeQL;  report $b "remove CodeQL (~1.7Gb, unused)"
      b=$(avail); sudo rm -rf /usr/share/swift;             report $b "remove swift (~3.4Gb, unused)"
      b=$(avail); sudo rm -rf /usr/lib/jvm;                 report $b "remove jvm (~1.4Gb, unused)"
      # docker image prune runs before any DB container exists (safe); it also prints its own
      # "Total reclaimed space" line in addition to the avail delta below.
      b=$(avail); sudo docker image prune -af;              report $b "docker image prune (~1.9Gb)"
      df -h /
      # Disabled - freed < 1 GB or breaks legs; uncomment if a job needs more space:
      # b=$(avail); sudo apt-get clean;                     report $b "apt clean (~0.1Gb)"
      # b=$(avail); sudo rm -rf /usr/share/dotnet;          report $b "remove dotnet (~2-3Gb est)"
  displayName: Cleanup Junk

# Diagnostic: list the heaviest resident processes so we can spot agent background services worth
# killing to free RAM for the test process (some jobs run near the memory ceiling). RSS is in KB.
- task: CmdLine@2
  inputs:
    script: |
      echo ">>> Top memory-consuming processes (RSS > 10 MB):"
      ps -eo pid,ppid,rss,comm --sort=-rss | awk 'NR==1 {print; next} $3 > 10240' | head -n 51
  displayName: Probe memory (top processes)
  condition: succeeded()

- task: DownloadPipelineArtifact@2
  inputs:
    artifactName: $(artifact_test_scripts)
    targetPath: '$(System.DefaultWorkingDirectory)/scripts'
  condition: and(variables.title, succeeded())
  displayName: Extract test scripts

- task: CmdLine@2
  inputs:
    # The leg needs the index, not the tree: BaselinesWriter creates its own directories and always
    # writes whole files, so nothing here is ever read back from the repository. --sparse lays out the
    # two root files instead of 343541, and --depth 1 --single-branch skips ~420 Mb of history for a
    # tree the leg only appends to. Master is cloned rather than the run branch, which may not
    # exist yet - see the push below. The commit step pairs this with git add --sparse.
    #
    # http.proactiveAuth is what makes the token in the url count: git sends credentials only after a
    # 401 challenge, and github never challenges an anonymous read of a public repository - so without
    # it this clone is unauthenticated and github's unauthenticated-download throttle kills the leg
    # (three legs on build 23238). The credential also has to be complete - user:token, not token
    # alone, or git asks for the password it is missing. -c is written to the clone's config, so the
    # fetch in the push retry below authenticates too.
    script: 'git clone --depth 1 --single-branch --sparse -c http.proactiveAuth=basic --branch $(baselines_master) https://x-access-token:$(BASELINES_GH_PAT)@github.com/linq2db/linq2db.baselines.git baselines'
    workingDirectory: '$(System.DefaultWorkingDirectory)'
  displayName: Checkout test baselines
  condition: and(variables.title, ${{ parameters.with_baselines }}, succeeded())

- task: DownloadPipelineArtifact@2
  inputs:
    artifactName: $(artifact_test_configs)
    targetPath: '$(System.DefaultWorkingDirectory)/configs'
  condition: and(variables.title, succeeded())
  displayName: Extract test configs

- task: CmdLine@2
  inputs:
    script: 'chmod +x $(script_global)'
    workingDirectory: '$(System.DefaultWorkingDirectory)/scripts'
  condition: and(variables.title, variables.script_global, succeeded())
  displayName: Mark script as executable

- task: CmdLine@2
  inputs:
    script: 'chmod +x $(script_local)'
    workingDirectory: '$(System.DefaultWorkingDirectory)/scripts'
  condition: and(variables.title, variables.script_local, succeeded())
  displayName: Mark script as executable

- task: CmdLine@2
  inputs:
    script: '$(System.DefaultWorkingDirectory)/scripts/$(script_global)'
    workingDirectory: '$(System.DefaultWorkingDirectory)/scripts'
  condition: and(variables.title, variables.script_global, succeeded())
  displayName: Setup tests
  env:
    # hana2.sh clones linq2db.ci, and an unauthenticated clone is subject to github's
    # unauthenticated-download throttle. No other setup script reads this.
    GITHUB_TOKEN: $(BASELINES_GH_PAT)

# One block per TFM, run in list order.
- ${{ each tfm in parameters.tfms }}:
  - task: DownloadPipelineArtifact@2
    inputs:
      artifactName: $(artifact_test_${{ tfm.flag }}_binaries)
      targetPath: '$(System.DefaultWorkingDirectory)/${{ tfm.dir }}'
    condition: and(variables.title, eq(variables['${{ tfm.flag }}'], 'true'), succeeded())
    displayName: 'Extract ${{ tfm.label }} test binaries'

  - task: CmdLine@2
    inputs:
      script: 'cp $(System.DefaultWorkingDirectory)/configs/${{ tfm.flag }}/$(config).json ${{ tfm.dir }}/UserDataProviders.json'
      workingDirectory: '$(System.DefaultWorkingDirectory)'
    condition: and(variables.title, eq(variables['${{ tfm.flag }}'], 'true'), succeeded())
    displayName: 'Copy ${{ tfm.label }} test config'

  - task: UseDotNet@2
    displayName: 'Use ${{ tfm.label }}'
    inputs:
      packageType: sdk
      version: ${{ tfm.sdk }}
    condition: and(variables.title, eq(variables['${{ tfm.flag }}'], 'true'), succeeded())

  - task: CmdLine@2
    inputs:
      script: '$(System.DefaultWorkingDirectory)/scripts/$(script_local)'
      workingDirectory: '$(System.DefaultWorkingDirectory)/${{ tfm.dir }}/main/x64'
    condition: and(variables.title, eq(variables['${{ tfm.flag }}'], 'true'), variables.script_local, succeeded())
    displayName: 'Setup ${{ tfm.label }} tests'

  # Main suite. Retry legs (Access, Oracle) get MTP's in-process failed-test retry plus a whole-step
  # retry for the crash case, which is what forces the pair of otherwise identical steps.
  - ${{ if or(eq(tfm.pr_main, true), eq(parameters.full_run, true)) }}:
    - script: dotnet ./${{ tfm.dir }}/main/x64/linq2db.Tests.dll --filter "TestCategory != SkipCI" --settings ./${{ tfm.dir }}/main/x64/.runsettings --report-trx --report-trx-filename ${{ tfm.dir }}-main-x64.trx --results-directory TestResults --hangdump --hangdump-timeout 5m
      condition: and(variables.title, eq(variables['${{ tfm.flag }}'], 'true'), succeeded(), ne(variables.retry, 'true'))
      displayName: 'Tests (${{ tfm.label }}): $(title)'

    - script: dotnet ./${{ tfm.dir }}/main/x64/linq2db.Tests.dll --filter "TestCategory != SkipCI" --settings ./${{ tfm.dir }}/main/x64/.runsettings --report-trx --report-trx-filename ${{ tfm.dir }}-main-x64.trx --results-directory TestResults --hangdump --hangdump-timeout 5m $(test_retry_args)
      condition: and(variables.title, eq(variables['${{ tfm.flag }}'], 'true'), succeeded(), eq(variables.retry, 'true'))
      displayName: 'Tests (${{ tfm.label }}): $(title)'
      retryCountOnTaskFailure: 2

  - script: dotnet ./${{ tfm.dir }}/efcore/x64/linq2db.EntityFrameworkCore.Tests.dll --filter "TestCategory != SkipCI" --settings ./${{ tfm.dir }}/efcore/x64/.runsettings --report-trx --report-trx-filename ${{ tfm.dir }}-efcore-x64.trx --results-directory TestResults --hangdump --hangdump-timeout 5m
    condition: and(variables.title, eq(variables['${{ tfm.flag }}'], 'true'), succeeded())
    displayName: 'EF.Core Tests (${{ tfm.label }}): $(title)'

  - task: CmdLine@2
    inputs:
      script: 'rm -rf $(System.DefaultWorkingDirectory)/${{ tfm.dir }}'
    condition: and(variables.title, eq(variables['${{ tfm.flag }}'], 'true'))
    displayName: 'Remove ${{ tfm.label }} test binaries'

- task: PublishTestResults@2
  condition: and(variables.title, succeededOrFailed())
  inputs:
    testRunner: VsTest
    testResultsFiles: '**/*.trx'
    testRunTitle: 'Linux / $(title)'
    failTaskOnMissingResultsFile: true

- task: PowerShell@2
  inputs:
    pwsh: true
    filePath: '$(System.DefaultWorkingDirectory)/scripts/push-baselines.ps1'
    arguments: -Platform "Linux" -Title "$(title)" -Branch "$(baselines_branch)" -BaselinesMaster "$(baselines_master)" -PrId "$(source_pr_id)"
    workingDirectory: '$(System.DefaultWorkingDirectory)/baselines'
  displayName: Commit test baselines
  condition: and(variables.title, succeeded(), ${{ parameters.with_baselines }})
  env:
    GITHUB_TOKEN: $(BASELINES_GH_PAT)
    EMAIL: azp@linq2db.com
    GIT_AUTHOR_NAME: Azure Pipelines Bot
    GIT_COMMITTER_NAME: Azure Pipelines Bot

parameters:
  with_baselines: false
  full_run: false
  # Per-TFM knobs driving the loops below. One entry generates the whole
  # extract -> configure -> setup -> test -> cleanup block for that TFM, so adding or retiring a TFM
  # is a one-line change rather than a copied 70-line section.
  #   flag    : matrix variable holding the per-leg enable switch; also names the binaries artifact
  #             ($(artifact_test_<flag>_binaries)) and the config subdirectory (configs\<flag>)
  #   label   : human-readable name used in step display names
  #   dir     : directory the test binaries are extracted into
  #   trx     : filename prefix for the .trx result files
  #   sdk     : UseDotNet@2 version to install; empty for netfx, which ships with the image
  #   pr_main : whether the main (non-EF) suite runs on PR runs too, or only on release (full_run)
  #             runs. Legs where this is false emit no main-test step at all outside a release run.
  tfms:
  - { flag: netfx,  label: 'NETFX',   dir: '$(netfx_tfm)', trx: 'netfx',   sdk: '',     pr_main: true  }
  - { flag: net80,  label: '.NET 8',  dir: 'net8.0',       trx: 'net8.0',  sdk: '8.x',  pr_main: false }
  - { flag: net90,  label: '.NET 9',  dir: 'net9.0',       trx: 'net9.0',  sdk: '9.x',  pr_main: false }
  - { flag: net100, label: '.NET 10', dir: 'net10.0',      trx: 'net10.0', sdk: '10.x', pr_main: true  }

steps:
- checkout: none

# .NET 8, 9 and 10 SDKs already ship with the image https://github.com/actions/runner-images/blob/main/images/windows/Windows2022-Readme.md
# so only the x86 ones need installing, and only on an x86 leg.
- ${{ each tfm in parameters.tfms }}:
  - ${{ if ne(tfm.sdk, '') }}:
    - task: UseDotNet@2
      displayName: 'Install ${{ tfm.label }} (x86)'
      inputs:
        packageType: sdk
        version: ${{ tfm.sdk }}
      condition: and(variables.title, eq(variables['${{ tfm.flag }}'], 'true'), eq(variables.arch, 'x86'), succeeded())
      env:
        PROCESSOR_ARCHITECTURE: x86

- ${{ each tfm in parameters.tfms }}:
  - ${{ if ne(tfm.sdk, '') }}:
    - task: UseDotNet@2
      displayName: 'Install ${{ tfm.label }} (x64)'
      inputs:
        packageType: sdk
        version: ${{ tfm.sdk }}

- task: DownloadPipelineArtifact@2
  inputs:
    artifactName: $(artifact_test_scripts)
    targetPath: '$(System.DefaultWorkingDirectory)/scripts'
  condition: and(variables.title, succeeded())
  displayName: Extract test scripts

# Re-create the baselines branch if a previous completed run deleted it (empty-branch
# cleanup). Without this, a "rerun failed jobs" restart fails on the clone below because
# create_baselines_branch is not re-run on a partial restart. See build 21555.
- task: PowerShell@2
  inputs:
    pwsh: true
    filePath: '$(System.DefaultWorkingDirectory)/scripts/ensure-baselines-branch.ps1'
    arguments: -Branch "$(baselines_branch)" -BaselinesMaster "$(baselines_master)" -BaseHash "$(baselines_head)"
    workingDirectory: '$(System.DefaultWorkingDirectory)'
  displayName: Ensure test baselines branch
  condition: and(variables.title, ${{ parameters.with_baselines }}, succeeded())
  env:
    GITHUB_TOKEN: $(BASELINES_GH_PAT)

- task: CmdLine@2
  inputs:
    script: 'git clone https://$(BASELINES_GH_PAT)@github.com/linq2db/linq2db.baselines.git baselines && cd baselines && git checkout -b $(baselines_branch) origin/$(baselines_branch) && cd ..'
    workingDirectory: '$(System.DefaultWorkingDirectory)'
  displayName: Checkout test baselines
  condition: and(variables.title, ${{ parameters.with_baselines }}, succeeded())

- task: DownloadPipelineArtifact@2
  inputs:
    artifactName: $(artifact_test_configs)
    targetPath: '$(System.DefaultWorkingDirectory)/configs'
  condition: and(variables.title, succeeded())
  displayName: Extract test configs

- task: CmdLine@2
  inputs:
    script: '$(System.DefaultWorkingDirectory)/scripts/$(script_global)'
    workingDirectory: '$(System.DefaultWorkingDirectory)/scripts'
  condition: and(variables.title, variables.script_global, succeeded())
  displayName: Execute Global Setup Script

- task: PowerShell@2
  inputs:
    filePath: '$(System.DefaultWorkingDirectory)/scripts/$(psscript_global)'
    workingDirectory: '$(System.DefaultWorkingDirectory)/scripts'
  condition: and(variables.title, variables.psscript_global, succeeded())
  displayName: Execute Global PowerShell Setup Script

# Optional RAM disk mount (actions/runner-images#7193): built-in iSCSI Target ramdisk, verified
# SqlCe-usable but with no measured suite speedup (the ~4 min feature install outweighs the I/O
# gain), so it's DORMANT -- gated behind the `use_ramdisk` variable, undefined by default. Set
# use_ramdisk=true to enable; consuming the mounted volume (relocating TestData.sdf onto it) is
# left to the future I/O-bound use case that justifies turning it on.
- task: PowerShell@2
  inputs:
    filePath: '$(System.DefaultWorkingDirectory)/scripts/ramdisk.ps1'
    workingDirectory: '$(System.DefaultWorkingDirectory)/scripts'
  condition: and(variables.title, eq(variables.psscript_global, 'sqlce.ps1'), eq(variables.use_ramdisk, 'true'), succeeded())
  displayName: 'Mount RAM disk (opt-in)'

# One block per TFM, run in list order. $(arch) is resolved per matrix leg in test-jobs.yml, so the
# x86 and x64 variants of every step below collapse into a single step.
- ${{ each tfm in parameters.tfms }}:
  - task: DownloadPipelineArtifact@2
    inputs:
      artifactName: $(artifact_test_${{ tfm.flag }}_binaries)
      targetPath: '$(System.DefaultWorkingDirectory)/${{ tfm.dir }}'
    condition: and(variables.title, eq(variables['${{ tfm.flag }}'], 'true'), succeeded())
    displayName: 'Extract ${{ tfm.label }} test binaries'

  - task: CmdLine@2
    inputs:
      script: 'copy $(System.DefaultWorkingDirectory)\configs\${{ tfm.flag }}\$(config).json $(System.DefaultWorkingDirectory)\${{ tfm.dir }}\UserDataProviders.json'
    condition: and(variables.title, eq(variables['${{ tfm.flag }}'], 'true'), succeeded())
    displayName: 'Copy ${{ tfm.label }} test config'

  - task: CmdLine@2
    inputs:
      script: '$(System.DefaultWorkingDirectory)/scripts/$(script_local)'
      workingDirectory: '$(System.DefaultWorkingDirectory)/${{ tfm.dir }}/main/$(arch)'
    condition: and(variables.title, eq(variables['${{ tfm.flag }}'], 'true'), variables.script_local, succeeded())
    displayName: 'Execute ${{ tfm.label }} Setup Script'

  - task: PowerShell@2
    inputs:
      filePath: '$(System.DefaultWorkingDirectory)/scripts/$(psscript_local)'
      workingDirectory: '$(System.DefaultWorkingDirectory)/${{ tfm.dir }}/main/$(arch)'
    condition: and(variables.title, eq(variables['${{ tfm.flag }}'], 'true'), variables.psscript_local, succeeded())
    displayName: 'Execute ${{ tfm.label }} PowerShell Setup Script'

  - task: CmdLine@2
    inputs:
      script: '$(System.DefaultWorkingDirectory)/scripts/$(pre_test_win_local)'
      workingDirectory: '$(System.DefaultWorkingDirectory)/scripts'
    condition: and(variables.title, variables.pre_test_win_local, succeeded())
    displayName: Execute Pre-test Script

  # Main suite. Retry legs (Access, Oracle) get MTP's in-process failed-test retry plus a whole-step
  # retry for the crash case, which is what forces the pair of otherwise identical steps.
  - ${{ if or(eq(tfm.pr_main, true), eq(parameters.full_run, true)) }}:
    - script: ${{ tfm.dir }}\main\$(arch)\linq2db.Tests.exe --filter "TestCategory != SkipCI" --settings ${{ tfm.dir }}\main\$(arch)\.runsettings --report-trx --report-trx-filename ${{ tfm.trx }}-main-$(arch).trx --results-directory TestResults --hangdump --hangdump-timeout 5m
      displayName: 'Tests (${{ tfm.label }}): $(title)'
      condition: and(variables.title, eq(variables['${{ tfm.flag }}'], 'true'), succeeded(), ne(variables.retry, 'true'))

    - script: ${{ tfm.dir }}\main\$(arch)\linq2db.Tests.exe --filter "TestCategory != SkipCI" --settings ${{ tfm.dir }}\main\$(arch)\.runsettings --report-trx --report-trx-filename ${{ tfm.trx }}-main-$(arch).trx --results-directory TestResults --hangdump --hangdump-timeout 5m $(test_retry_args)
      displayName: 'Tests (${{ tfm.label }}): $(title)'
      condition: and(variables.title, eq(variables['${{ tfm.flag }}'], 'true'), succeeded(), eq(variables.retry, 'true'))
      retryCountOnTaskFailure: 2

  - script: ${{ tfm.dir }}\efcore\$(arch)\linq2db.EntityFrameworkCore.Tests.exe --filter "TestCategory != SkipCI" --settings ${{ tfm.dir }}\efcore\$(arch)\.runsettings --report-trx --report-trx-filename ${{ tfm.trx }}-efcore-$(arch).trx --results-directory TestResults --hangdump --hangdump-timeout 5m
    displayName: 'EF.Core Tests (${{ tfm.label }}): $(title)'
    condition: and(variables.title, eq(variables['${{ tfm.flag }}'], 'true'), succeeded())

  - task: CmdLine@2
    inputs:
      script: '$(System.DefaultWorkingDirectory)/scripts/$(post_test_win_local)'
      workingDirectory: '$(System.DefaultWorkingDirectory)/scripts'
    condition: and(variables.title, variables.post_test_win_local, succeeded())
    displayName: Execute Post-test Script

  - task: CmdLine@2
    inputs:
      script: 'if exist $(System.DefaultWorkingDirectory)\${{ tfm.dir }} rmdir $(System.DefaultWorkingDirectory)\${{ tfm.dir }} /S /Q'
    condition: and(variables.title, eq(variables['${{ tfm.flag }}'], 'true'))
    displayName: 'Remove ${{ tfm.label }} test binaries'

- task: PublishTestResults@2
  condition: and(variables.title, succeededOrFailed())
  inputs:
    testRunner: VsTest
    testResultsFiles: '**/*.trx'
    testRunTitle: 'Windows / $(title)'
    failTaskOnMissingResultsFile: true

- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: |
      Write-Host "Add baselines changes to commit (index)"
      $output = git add -A
      if ($LASTEXITCODE -ne 0) {
          Write-Host "Failed to add baselines changes. Error code ${LASTEXITCODE}, output: ${output}"
          exit 1
      }
      Write-Host "Create commit"
      $output = git commit -m "[Windows / $(title)] baselines"
      if ($output -match "nothing to commit") {
          Write-Host "No baselines changes detected"
          exit 0
      }
      if ($LASTEXITCODE -ne 0) {
          Write-Host "Failed to create commit. Error code ${LASTEXITCODE}, output: ${output}"
          exit 1
      }
      $rebaseAttempts = 10
      do {
          Write-Host "Pull with rebase"
          $output = git pull --rebase
          if ($LASTEXITCODE -ne 0) {
              Write-Host "Failed to rebase. Error code ${LASTEXITCODE}, output: ${output}"
              Write-Host "Display conflict diff"
              $output = git diff ORIG_HEAD FETCH_HEAD
              if ($LASTEXITCODE -ne 0) {
                  Write-Host "Failed to render diff. Error code ${LASTEXITCODE}, output:"
                  Write-Output $output
                  exit 1
              }
              Write-Output $output
              exit 1
          }
          Write-Host "Push baselines to server"
          $output = git push https://$(BASELINES_GH_PAT)@github.com/linq2db/linq2db.baselines.git $(baselines_branch)
          if ($LASTEXITCODE -ne 0) {
              Write-Host "Failed to push baselines. Error code ${LASTEXITCODE}, output: ${output}"
          } else {
              exit 0
          }
          $rebaseAttempts = $rebaseAttempts - 1
      } while ($rebaseAttempts -gt 0)
      Write-Host "Failed to push baselines"
      exit 1
    workingDirectory: '$(System.DefaultWorkingDirectory)/baselines'
  displayName: Commit test baselines
  condition: and(variables.title, succeeded(), ${{ parameters.with_baselines }})
  env:
    GITHUB_TOKEN: $(BASELINES_GH_PAT)
    EMAIL: azp@linq2db.com
    GIT_AUTHOR_NAME: Azure Pipelines Bot
    GIT_COMMITTER_NAME: Azure Pipelines Bot

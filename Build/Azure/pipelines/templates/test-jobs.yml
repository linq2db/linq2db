parameters:
  enabled: false
  with_baselines: false
  test_matrix: []
  full_run: false # disable by default
  # Linux legs allowed to run at once, out of the ten slots the project has. 0 leaves the job
  # uncapped, which is the default because a cap measured worse than none.
  #
  # The case for one looked strong. Both test jobs become eligible in the same second, linux takes
  # all ten slots within 0.3 min, and windows then waited 44.4 min on build 23028 and 54.8 on 23024,
  # with its longest legs starting last and finishing alone. Six is where the work splits. It did fix
  # that symptom - the first windows leg started at +0.1 on 23045 - and it still lost the run: 23059
  # took 164.4 min against 156.7 for the uncapped 23028, on 1151 against 1148 agent-minutes of work.
  #
  # The reason is the floor rather than the packing. Uncapped, both jobs draw on all ten slots and
  # the floor is total_work/10, which is 115 min on 23059's numbers. Capped at six, windows is
  # confined to four slots and its 501 agent-minutes need 125 min there, so the floor is 10 min
  # worse before a single leg runs. Both builds finished 20 to 25 min above their own floor, so the
  # cap had no packing advantage to trade back. Windows starting late reads badly on the timeline
  # but did not cost wall clock - 23028 ran windows last and still finished first.
  #
  # Put a number here only with a measurement behind it, and note that a cap also makes the file
  # order of test-matrix.yml load-bearing, which the note above that matrix explains.
  linux_max_parallel: 0

jobs:
##############################################################################################
#  This job runs before tests and ensures we have branch in baselines repository and         #
#  creates it if it is missing                                                               #
##############################################################################################
- job: create_baselines_branch
  pool:
    vmImage: 'windows-2025'
  displayName: 'Create Test Baselines Branch'
  dependsOn: build_job
  condition: and(eq(${{ parameters.enabled }}, 'true'), eq(${{ parameters.with_baselines }}, 'true'))
  variables:
    source_pr_id: $[coalesce(variables['system.pullRequest.pullRequestNumber'], '')]

  steps:
  - checkout: none
  - task: DownloadPipelineArtifact@2
    inputs:
      artifactName: $(artifact_test_scripts)
      targetPath: '$(System.DefaultWorkingDirectory)/scripts'
    displayName: Extract test scripts
  - task: PowerShell@2
    inputs:
      pwsh: true
      filePath: '$(System.DefaultWorkingDirectory)/scripts/ensure-baselines-branch.ps1'
      arguments: -PrId "$(source_pr_id)" -BaselinesMaster "$(baselines_master)" -Rebase -EmitOutputs
      workingDirectory: '$(System.DefaultWorkingDirectory)'
    displayName: Checkout test baselines
    name: baselines_init
    env:
      GITHUB_TOKEN: $(BASELINES_GH_PAT)
      EMAIL: azp@linq2db.com
      GIT_AUTHOR_NAME: Azure Pipelines Bot
      GIT_COMMITTER_NAME: Azure Pipelines Bot

###################
#  Tests: Windows #
#  Windows 2025   #
###################
- job: test_windows_job
  pool:
    vmImage: 'windows-2025'

  displayName: 'Win'
  dependsOn:
  - create_baselines_branch
  - build_x86_job # only the windows legs consume win-x86 binaries, so only they wait for them
  # Release (full_run) legs run every TFM's main suite, not just net10, and jobs now bundle several
  # providers - so they need materially more headroom than a PR run. default: 60, max: 360.
  ${{ if eq(parameters.full_run, true) }}:
    timeoutInMinutes: 300
  ${{ if not(eq(parameters.full_run, true)) }}:
    timeoutInMinutes: 180
  condition: ${{ parameters.enabled }}
  variables:
    baselines_branch: $[ dependencies.create_baselines_branch.outputs['baselines_init.baselines_branch'] ]
    source_pr_id: $[coalesce(variables['system.pullRequest.pullRequestNumber'], '')]

  strategy:
    matrix:
      ${{ each test_config in parameters.test_matrix }}:
        ${{ if and(eq(test_config.enabled, 'true'), eq(test_config.enable_os_windows, 'true')) }}:
          ${{ test_config.name }}:
            title: ${{ test_config.title }}
            config: ${{ test_config.config_win }}
            script_global: ${{ test_config.script_win_global }}
            psscript_global: ${{ test_config.psscript_win_global }}
            script_local: ${{ test_config.script_win_local }}
            psscript_local: ${{ test_config.psscript_win_local }}
            pre_test_win_local: ${{ test_config.pre_test_win_local }}
            post_test_win_local: ${{ test_config.post_test_win_local }}
            netfx: ${{ test_config.enable_fw_netfx }}
            # Windows runs a non-netfx TFM only for a leg Linux cannot cover. netfx is Windows-only,
            # so it always runs here; net8/9/10 on a leg that also has a linux job would repeat what
            # that job already ran - the EF.Core suite runs on every enabled TFM unconditionally, and
            # on a release run so does the main suite. Every leg needing its non-netfx TFMs on windows
            # (Access, SqlCE, SQL Server 2005-2016) has no linux job, so enable_os_ubuntu decides it
            # and no matrix entry has to state it twice. win_tfms_always opts an entry out, for the
            # one case where the windows leg tests something the linux one cannot reach even on the
            # same TFM - see w_DB2InformixDuckDB in test-matrix.yml.
            ${{ if or(ne(test_config.enable_os_ubuntu, 'true'), eq(test_config.win_tfms_always, true)) }}:
              net80: ${{ test_config.enable_fw_net80 }}
              net90: ${{ test_config.enable_fw_net90 }}
              net100: ${{ test_config.enable_fw_net100 }}
            ${{ if and(eq(test_config.enable_os_ubuntu, 'true'), ne(test_config.win_tfms_always, true)) }}:
              net80: false
              net90: false
              net100: false
            # Resolved here rather than branched on in the workflow, so each test/setup step exists
            # once with an $(arch) path instead of twice with one half always skipped.
            ${{ if eq(test_config.x86, true) }}:
              arch: x86
            ${{ if not(eq(test_config.x86, true)) }}:
              arch: x64
            retry: ${{ test_config.retry }}
            win_efcore_only: ${{ test_config.win_efcore_only }}

  steps:
  - template: test-workflow-windows.yml
    parameters:
      with_baselines: ${{ parameters.with_baselines }}
      full_run: ${{ parameters.full_run }}

########################
#  Tests: Ubuntu 24.04 #
########################
- job: test_ubuntu_job
  pool:
    vmImage: 'ubuntu-24.04'
  ${{ if eq(parameters.full_run, true) }}:
    timeoutInMinutes: 300
  ${{ if not(eq(parameters.full_run, true)) }}:
    timeoutInMinutes: 180
  displayName: 'Lin'
  dependsOn: create_baselines_branch
  condition: ${{ parameters.enabled }}
  variables:
    baselines_branch: $[ dependencies.create_baselines_branch.outputs['baselines_init.baselines_branch'] ]
    source_pr_id: $[coalesce(variables['system.pullRequest.pullRequestNumber'], '')]

  strategy:
    # Emitted only when a cap is asked for, so the default of 0 leaves the property out entirely
    # rather than resting on how Azure reads maxParallel: 0. Why the default is 0 is on
    # linux_max_parallel above.
    ${{ if gt(parameters.linux_max_parallel, 0) }}:
      maxParallel: ${{ parameters.linux_max_parallel }}
    matrix:
      ${{ each test_config in parameters.test_matrix }}:
        ${{ if and(eq(test_config.enabled, 'true'), eq(test_config.enable_os_ubuntu, 'true')) }}:
          ${{ test_config.name }}:
            title: ${{ test_config.title }}
            config: ${{ test_config.config_linux }}
            script_global: ${{ test_config.script_linux_global }}
            script_local: ${{ test_config.script_linux_local }}
            net80: ${{ test_config.enable_fw_net80 }}
            net90: ${{ test_config.enable_fw_net90 }}
            net100: ${{ test_config.enable_fw_net100 }}
            retry: ${{ test_config.retry }}

  steps:
  - template: test-workflow-linux.yml
    parameters:
      with_baselines: ${{ parameters.with_baselines }}
      full_run: ${{ parameters.full_run }}

parameters:
  enabled: false

jobs:
##############
# Tests: cli #
##############
- job: test_cli_job
  strategy:
    matrix:
      Windows:
        imageName: windows-2025
        executableExtension: .exe
      Linux:
        imageName: ubuntu-24.04
        executableExtension: ''
  pool:
    vmImage: $(imageName)
  displayName: 'Tests: CLI'
  dependsOn: build_job
  timeoutInMinutes: 30
  condition: ${{ parameters.enabled }}

  steps:
  - checkout: self

  - task: UseDotNet@2
    displayName: 'Use latest .NET SDK'
    inputs:
      packageType: sdk
      version: 10.x

  - task: UseDotNet@2
    displayName: 'Install .NET 8 runtime (x64)'
    inputs:
      packageType: runtime
      version: 8.x

  - task: UseDotNet@2
    displayName: 'Install .NET 9 runtime (x64)'
    inputs:
      packageType: runtime
      version: 9.x

  - task: DotNetCoreCLI@2
    inputs:
      command: build
      projects: 'Tests/LinqToDB.CLI/Tests.LinqToDB.CLI.csproj'
      arguments: '--configuration $(test_configuration)'
    displayName: Build cli tests

  - task: PowerShell@2
    inputs:
      targetType: inline
      pwsh: true
      script: |
        foreach ($tfm in @('net8.0', 'net9.0', 'net10.0')) {
          $testExecutable = Join-Path ".build/bin/Tests.LinqToDB.CLI/$(test_configuration)/$tfm" "linq2db.CLI.Tests$(executableExtension)"

          & $testExecutable --filter "TestCategory != SkipCI" --settings .runsettings --report-trx --report-trx-filename "cli-$tfm.trx" --results-directory CliTestResults --hangdump --hangdump-timeout 5m $(test_retry_args)

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
        }
    displayName: Run cli tests

  - task: PublishTestResults@2
    inputs:
      testRunner: VsTest
      testResultsFiles: 'CliTestResults/*.trx'
      testRunTitle: 'linq2db cli'
      failTaskOnMissingResultsFile: true
    displayName: Publish cli test results
    condition: succeededOrFailed()

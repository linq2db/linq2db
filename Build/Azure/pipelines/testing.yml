# Dispatch-order probe. Same job and matrix shape as test-all, no build, no tests: every leg just
# holds a slot for a few minutes. A run costs ~84 agent-minutes and about a quarter of an hour of
# wall clock, against ~20 agent-hours and three hours for the real thing, so an ordering question
# can be answered the same morning it is asked.
#
# It exists because three test-all runs were spent on one: legs are dispatched in case-insensitive
# alphabetical order of the matrix key, which is why the keys in test-matrix.yml carry an a_ .. y_
# prefix. Two earlier attempts failed for reasons a probe would have shown in minutes - one reordered
# the entries, which does nothing, and one numbered the keys 01_ .. 25_, which breaks the documented
# rule that a matrix configuration name must start with a letter.
#
# What it can answer: the order Azure requests agents in, and whether a rename changes it. What it
# cannot: behaviour under a busy pool. When another run holds the slots the order scrambles whatever
# the names are, so run this when the pool is quiet and read it as the uncontended order.
#
# The leg names below are a copy of the ones test-matrix.yml produces. Refresh them from a recent
# test-all timeline when that file changes, or the probe answers a question about the wrong set.
#
# One run, two answers: the windows job builds its displayName from a per-leg variable while the
# linux job is left alone. The schema says a matrix key "is appended to the name of the job", so the
# windows legs should come out as "Win <title> <key>" - longer, not cleaner. If instead they read
# "Win <title>", the key is replaced and the a_ .. y_ prefixes can be hidden from the UI while still
# doing their sorting. A literal "Win $(title) <key>" would mean the variable does not expand here.
#
#   DO NOT MERGE THIS FILE. It has taken the place of the real provider matrix, which is parked next
#   to it as testing.backup.yml, so that the pipeline definitions already pointing here - test-all,
#   test-cli and every test-<provider> - run the probe instead. That is what makes it usable at all:
#   a new pipeline would have to be registered by hand in Azure DevOps first. Merging it would
#   replace provider testing with a stub. Swap the two files back before this branch goes anywhere.

parameters:
- name: hold_minutes
  displayName: 'Minutes each leg holds its agent'
  type: number
  # Long enough that the legs cannot all hold a slot at once - that queueing is the whole signal -
  # and long enough that agent-acquisition jitter, which runs to a couple of minutes, does not blur
  # the waves. Three gives 28 legs over ten slots as three clean waves.
  default: 3

trigger: none
pr:
  branches:
    include:
    - '*'

stages:

- stage: ''
  displayName: ''
  jobs:

  - job: test_windows_job
    pool:
      vmImage: 'windows-2025'
    displayName: 'Win $(title)'
    timeoutInMinutes: 60
    strategy:
      matrix:
        a_SqlServer2014:
          leg: a_SqlServer2014
          title: SQL Server 2014
        d_SqlServer2012:
          leg: d_SqlServer2012
          title: SQL Server 2012
        e_SqlServer2008:
          leg: e_SqlServer2008
          title: SQL Server 2008
        f_SqlServer2016:
          leg: f_SqlServer2016
          title: SQL Server 2016
        g_SqlCE:
          leg: g_SqlCE
          title: SQL CE
        l_SqlServer2017_2019:
          leg: l_SqlServer2017_2019
          title: SQL Server 2017 + 2019
        m_SqlServer2022_2025:
          leg: m_SqlServer2022_2025
          title: SQL Server 2022 + 2025
        n_SqlServer2019Extras:
          leg: n_SqlServer2019Extras
          title: SQL Server EXTRAS
        o_SqlServer2005:
          leg: o_SqlServer2005
          title: SQL Server 2005
        r_Access_MDB:
          leg: r_Access_MDB
          title: Access MDB (Jet/ODBC)
        s_SQLite:
          leg: s_SQLite
          title: SQLite (all providers)
        v_Access_ACE_Odbc:
          leg: v_Access_ACE_Odbc
          title: Access ACE (ODBC) x86
        x_Access_ACE_OleDb:
          leg: x_Access_ACE_OleDb
          title: Access ACE (OLEDB) x86
    steps:
    - checkout: none
    - task: PowerShell@2
      inputs:
        targetType: inline
        pwsh: true
        script: |
          Write-Host "$(leg) started $([DateTime]::UtcNow.ToString('o'))"
          Start-Sleep -Seconds (60 * ${{ parameters.hold_minutes }})
      displayName: 'Hold a slot'

  - job: test_ubuntu_job
    pool:
      vmImage: 'ubuntu-24.04'
    displayName: 'Lin'
    timeoutInMinutes: 60
    strategy:
      matrix:
        b_ClickHouse:
          leg: b_ClickHouse
        c_PostgreSQL2:
          leg: c_PostgreSQL2
        h_SAPHANA2:
          leg: h_SAPHANA2
        i_PostgreSQL1:
          leg: i_PostgreSQL1
        j_Oracle1819:
          leg: j_Oracle1819
        k_Firebird:
          leg: k_Firebird
        l_SqlServer2017_2019:
          leg: l_SqlServer2017_2019
        m_SqlServer2022_2025:
          leg: m_SqlServer2022_2025
        n_SqlServer2019Extras:
          leg: n_SqlServer2019Extras
        p_MySQL:
          leg: p_MySQL
        q_Oracle2123:
          leg: q_Oracle2123
        s_SQLite:
          leg: s_SQLite
        t_Oracle1112:
          leg: t_Oracle1112
        u_YdbSybase:
          leg: u_YdbSybase
        w_DB2InformixDuckDB:
          leg: w_DB2InformixDuckDB
    steps:
    - checkout: none
    - task: PowerShell@2
      inputs:
        targetType: inline
        pwsh: true
        script: |
          Write-Host "$(leg) started $([DateTime]::UtcNow.ToString('o'))"
          Start-Sleep -Seconds (60 * ${{ parameters.hold_minutes }})
      displayName: 'Hold a slot'

variables:
  - template: templates/build-vars.yml

trigger: none
pr:
  branches:
    include:
    - '*'

stages:
- stage: ''
  displayName: ''
  jobs:
##############
#  BUILD JOB #
##############
  - template: templates/build-job.yml
    parameters:
      with_nugets: false
      with_examples: false
      with_tests: ${{ ne(variables['Build.DefinitionName'], 'test-cli') }}
      with_analyzers: false

#############
# TEST JOBS #
#############
  - ${{ if or(eq(variables['Build.DefinitionName'], 'test-all'), eq(variables['Build.DefinitionName'], 'test-cli')) }}:
    - template: templates/test-cli.yml
      parameters:
        enabled: succeeded()

  - ${{ if ne(variables['Build.DefinitionName'], 'test-cli') }}:
    - template: templates/test-matrix.yml
      parameters:
        enabled: succeeded()
        with_baselines: true
        full_run: false
        # db_filter is resolved inside test-matrix.yml from its surfaces map, keyed by definition
        # name. It used to be a 34-line if-chain here, which only Azure could read - the GitHub side
        # needs the same mapping, and #5848 already moved entry selection into that file for exactly
        # this reason.
# build solution only
variables:
  - template: templates/build-vars.yml

# always trigger on PRs
trigger: none
pr:
  # draft -> ready queues a new run for the same commit; it must not cancel the one in flight
  autoCancel: false
  branches:
    include:
    - '*'

stages:

- stage: ''
  displayName: ''
  jobs:
##############
#  BUILD JOB #
##############
  - template: templates/build-job.yml
    parameters:
      with_nugets: true
      with_examples: true
      with_tests: false
      with_analyzer_tests: true
      with_singlefile_smoke: true
      with_analyzers: true
      with_release: false
